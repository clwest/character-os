[project]
name = "character-os-shell"
version = "0.0.1"
description = "Django DRF shell — customer-facing service for character-os"
requires-python = ">=3.11"
dependencies = [
    # Core framework
    "django>=5.0,<6.0",
    "djangorestframework>=3.15",
    "django-cors-headers>=4.3",

    # Database
    "psycopg[binary]>=3.2",
    # pgvector wired in Phase 4 when embeddings port lands
    # "pgvector>=0.3",

    # Auth (Phase 1)
    "django-allauth[socialaccount]>=64.0",
    "djangorestframework-simplejwt>=5.3",

    # Billing (Phase 1)
    "dj-stripe>=2.9",

    # Async task queue (Phase 4 — spider/agent port)
    # "celery>=5.4",
    # "redis>=5.0",

    # HTTP client for talking to media-engine
    "httpx>=0.28",

    # Settings
    "django-environ>=0.11",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7",
    "pytest>=8.0",
    "pytest-django>=4.9",
    "django-debug-toolbar>=4.4",
    "ipython>=8.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "character_os.settings"
python_files = ["test_*.py", "*_test.py"]
