name: Media Engine (FastAPI)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  media-engine:
    runs-on: ubuntu-latest

    env:
      # Adapter selection is key-driven: with all provider keys
      # blank the runtime picks Mock providers automatically.
      # RUNWAY_FORCE_MOCK is set to "0" so pydantic-settings does
      # not silently flip Settings.runway_mock=True for tests that
      # construct real-mode adapters with an explicit fake key
      # (config, realtime provider, tts, R10 drift verifier).
      RUNWAY_FORCE_MOCK: "0"
      OPENAI_API_KEY: ""
      RUNWAY_API_KEY: ""
      STABILITY_API_KEY: ""
      ELEVENLABS_API_KEY: ""

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: media-engine/requirements.txt

      - name: Install ffmpeg
        # Video/audio composition, intro/outro, concat, and
        # audio-mix tests shell out to ffmpeg/ffprobe. Tests
        # ``pytest.skip`` when the binaries are missing, so
        # omitting this install silently hides ~30 tests.
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install media-engine deps
        working-directory: media-engine
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install test tools
        working-directory: media-engine
        run: python -m pip install pytest

      - name: Route smoke — app imports and mounts routes
        working-directory: media-engine
        run: python -c "from app.main import app; print(f'{len(app.routes)} routes')"

      - name: Media-engine tests
        working-directory: media-engine
        run: python -m pytest -q
