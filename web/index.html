<!doctype html>
<html lang="en" data-brand="v3">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Character OS — 24/7 Global AI</title>
    <!--
      BRAND_IDENTITY_V3 (SESSION 209): editorial dark-luxe —
      24/7 Global AI parent alignment. Ink + gold palette,
      Bodoni Moda display, DM Sans body, JetBrains Mono micro.

      data-brand="v3" activates the V3 token block in
      src/styles/tokens.css. "v2" rolls back to enterprise
      dark + gold (Geist). "v1" rolls back to editorial-warm.
      Both V2 and V1 are preserved for archaeology and
      emergency rollback. See docs/design/BRAND_IDENTITY_V3.md.

      Font loads (Bodoni Moda + DM Sans + JetBrains Mono)
      use Google Fonts. Geist link kept so a V2 rollback
      doesn't go faceless until a redeploy.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=DM+Sans:ital,opsz,wght@0,9..40,300..700;1,9..40,300..700&family=JetBrains+Mono:wght@400;500&family=Geist:wght@300..700&display=swap"
    />
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
